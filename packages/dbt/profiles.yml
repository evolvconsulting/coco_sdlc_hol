# =============================================================================
# EVOLV PAYMENT ANALYTICS - Snowflake-Native dbt Profile
# =============================================================================
# This profile is used for Snowflake-native dbt execution via EXECUTE DBT PROJECT.
# NOTE: No password or env_var() fields - auth is handled by Snowflake session.
# =============================================================================

dev:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: orgname-accountname
      user: USER
      authenticator: snowflake
      role: ATTENDEE_ROLE
      database: COCO_SDLC_HOL
      warehouse: COMPUTE_WH
      schema: STAGING
      threads: 4
